# A one-shot, owner-authorized bridge for the user's request to release r8
# from chat. Normal pushes, PRs, tags and code changes cannot launch SDK jobs.
# The build workflow itself remains workflow_dispatch-only.
name: release-command-r8

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read

concurrency:
  group: owner-r8-command
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch authorized r8 build
    if: >-
      ${{ github.repository == 'Medvedolog/medvemodem' &&
          github.event.issue.number == 14 &&
          github.event.comment.user.login == 'Medvedolog' &&
          github.event.comment.body == '/medvemodem publish r8' }}
    runs-on: ubuntu-latest
    steps:
      - name: Start explicitly requested manual build and verified release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.16.0-alpha1-r8 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'r8 already published: refusing to duplicate this release.'
            exit 0
          fi
          gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f publish_release=true -f release_tag=v0.16.0-alpha1-r8
          echo 'Dispatched the explicitly authorized, manual r8 SDK build.'


  dispatch-r10:
    name: Dispatch authorized r10 test build (no release)
    if: >-
      ${{ github.repository == 'Medvedolog/medvemodem' &&
          github.event.issue.number == 14 &&
          github.event.comment.user.login == 'Medvedolog' &&
          github.event.comment.body == '/medvemodem build r10' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Confirm synchronized r10 package versions
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq 'PKG_VERSION:=0.16.0_alpha1' Makefile
          grep -Fxq 'PKG_RELEASE:=10' Makefile
          for file in packages/luci-app-medvemodem/Makefile packages/medvemodem-bot/Makefile packages/luci-app-medvemodem-bot/Makefile; do
            grep -Fxq 'PKG_RELEASE:=10' "$file"
          done
          grep -Fq '## 0.16.0-alpha1-r10' docs/RELEASE-HIGHLIGHTS-ALPHA1-R10.md
      - name: Dispatch the manual SDK matrix without publishing a release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref main -f publish_release=false
          echo 'Dispatched r10 SDK matrix; release publication remains disabled.'

  qa-contracts:
    name: Manual LuCI source contracts (no SDK)
    if: >-
      ${{ github.repository == 'Medvedolog/medvemodem' &&
          github.event.issue.number == 14 &&
          github.event.comment.user.login == 'Medvedolog' &&
          github.event.comment.body == '/medvemodem qa luci' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify LuCI contracts and release-version consistency
        run: |
          python3 tests/test-luci-frontend.py
          sh tools/check-web-version.sh
          node --check packages/luci-app-medvemodem/htdocs/luci-static/resources/view/medvemodem/modem.js
          node --check tests/test-luci-browser.cjs

  qa-browser:
    name: Manual Chromium owner-change regression (no SDK)
    if: >-
      ${{ github.repository == 'Medvedolog/medvemodem' &&
          github.event.issue.number == 14 &&
          github.event.comment.user.login == 'Medvedolog' &&
          github.event.comment.body == '/medvemodem qa luci' }}
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Playwright client
        run: npm install --no-save --no-package-lock playwright@1.58.2
      - name: Exercise real LuCI view including EP06 native QMI handover
        run: node tests/test-luci-browser.cjs
