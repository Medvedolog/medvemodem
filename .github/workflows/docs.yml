# Lightweight documentation verification; never starts the OpenWrt SDK.
name: docs

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'docs/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - '**/*.md'
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  links-and-encoding:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      # every local link and #anchor of every Markdown file, not the index alone (docs sync audit DOC-03, 2026-11-19)
      - name: Verify Markdown encoding, links and anchors
        run: python3 tools/check-docs-sync.py
