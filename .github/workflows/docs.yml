# Lightweight documentation verification; never starts the OpenWrt SDK.
name: docs

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'docs/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - '**/*.md'
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  links-and-encoding:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Verify Markdown encoding and documentation index links
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import sys
          from urllib.parse import unquote

          root = pathlib.Path('.').resolve()
          paths = list(root.rglob('*.md'))
          errors = []
          for path in paths:
              if any(part in {'.git', 'node_modules', 'dist'} for part in path.parts):
                  continue
              try:
                  path.read_text(encoding='utf-8')
              except UnicodeError as exc:
                  errors.append(f'{path.relative_to(root)}: not UTF-8: {exc}')

          # The public documentation index is the entry point used by README.
          # Validate its local file links, preserving anchors for the renderer.
          index = root / 'docs' / 'README.md'
          if not index.is_file():
              errors.append('docs/README.md is missing')
          else:
              content = index.read_text(encoding='utf-8')
              for target in re.findall(r'\]\(([^)]+)\)', content):
                  url = target.split('#', 1)[0].strip()
                  if not url or re.match(r'^[a-z]+:', url, re.I) or url.startswith('//'):
                      continue
                  resolved = (index.parent / unquote(url)).resolve()
                  if not resolved.is_relative_to(root) or not resolved.is_file():
                      errors.append(f'docs/README.md: broken link {target}')

          if errors:
              print('\n'.join(errors), file=sys.stderr)
              sys.exit(1)
          print(f'OK: checked {len(paths)} Markdown files and documentation index links')
          PY
