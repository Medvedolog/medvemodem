# One-shot MedveModem alpha1 r4 publisher. Builds all six SDK targets and
# SDK jobs are manual-only (workflow_dispatch). No push/PR builds.
# publishes persistent assets directly (a tag created with GITHUB_TOKEN does
# not trigger a second GitHub Actions workflow).
name: publish-alpha1-r4

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish release assets as well as building packages'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: publish-alpha1-r4
  cancel-in-progress: true

jobs:
  packages:
    name: MedveModem r4 ${{ matrix.arch }} / OpenWrt ${{ matrix.release }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64_cortex-a53, aarch64_generic, x86_64]
        release: ['24.10.8', '25.12.6']
    steps:
      - uses: actions/checkout@v5
      - name: Validate version and pinned QModem installer source
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq 'PKG_VERSION:=0.16.0_alpha1' Makefile
          for f in Makefile packages/luci-app-medvemodem/Makefile packages/medvemodem-bot/Makefile packages/luci-app-medvemodem-bot/Makefile; do
            grep -Fxq 'PKG_VERSION:=0.16.0_alpha1' "$f"
            grep -Fxq 'PKG_RELEASE:=4' "$f"
          done
          grep -Fxq 'MEDVEMODEM_DOWNLOAD_BASE?=https://github.com/Medvedolog/medvemodem/releases/download/qmodem-$(QMODEM_VERSION)-r1' Makefile
      - name: Validate browser version metadata
        run: sh tools/check-web-version.sh
      - name: Build MedveModem, LuCI, bot and lpac
        run: sh tools/build.sh "${{ matrix.arch }}" "${{ matrix.release }}"
      - name: Verify required packages
        shell: bash
        run: |
          set -euo pipefail
          out="dist/${{ matrix.arch }}-${{ matrix.release }}"
          for pkg in medvemodem luci-app-medvemodem medvemodem-bot luci-app-medvemodem-bot medvemodem-lpac; do
            find "$out" -maxdepth 1 -type f \( -name "${pkg}_*r4*.ipk" -o -name "${pkg}-*r4*.apk" -o -name "${pkg}_*.ipk" -o -name "${pkg}-*.apk" \) | grep -q . || { echo "Missing package $pkg" >&2; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: medvemodem-r4-${{ matrix.arch }}-${{ matrix.release }}
          path: dist/${{ matrix.arch }}-${{ matrix.release }}/*.*pk
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish permanent MedveModem r4 release
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
    needs: packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: medvemodem-r4-*
          path: build-artifacts
          merge-multiple: false
      - name: Verify all six targets and calculate SHA256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          tag='v0.16.0-alpha1-r4'
          for arch in aarch64_cortex-a53 aarch64_generic x86_64; do
            for rel in 24.10.8 25.12.6; do
              dir="build-artifacts/medvemodem-r4-$arch-$rel"
              [ -d "$dir" ] || { echo "Missing target directory: $dir" >&2; exit 1; }
              for pkg in medvemodem luci-app-medvemodem medvemodem-bot luci-app-medvemodem-bot medvemodem-lpac; do
                find "$dir" -maxdepth 1 -type f \( -name "${pkg}_*.ipk" -o -name "${pkg}-*.apk" \) | grep -q . || { echo "Missing $pkg for $arch $rel" >&2; exit 1; }
              done
              tar -C "$dir" -czf "release-assets/medvemodem-0.16.0-alpha1-r4-$arch-$rel.tar.gz" .
            done
          done
          [ "$(find release-assets -name '*.tar.gz' | wc -l)" -eq 6 ]
          (cd release-assets && sha256sum *.tar.gz > SHA256SUMS)
          cat > release-assets/HIGHLIGHTS.txt <<'EOF'
          ## 0.16.0-alpha1-r4
          - Fix: align LuCI display version with engine and normalize underscore/hyphen package versions.
          - Whitelist diagnostics: compact status lights, short modem headings, non-overlapping service labels and failover backup numbering.
          - Condensed results: remove repeated per-channel paragraphs and show a single concise summary.
          - Component manager: detect Telegram bot core and LuCI independently; install missing packages from release assets with SHA256 verification.
          - Self-update: preserve full installed package versions and useful error messages in BusyBox JSON.
          - The QModem installer continues after unsuccessful individual fetch attempts; its log reports checksum and installation separately.
          - Installer pinned to permanent QModem 3.3.0_p20261108-r1 GitHub Release.
          - MedveModem engine, LuCI, Telegram bot, bot LuCI, and lpac packages for six OpenWrt SDK targets.
          - SHA256SUMS supplied for all target archives.
          EOF
      - name: Check prerequisite QModem permanent release and publish r4
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          qtag='qmodem-3.3.0_p20261108-r1'
          published=$(gh release view "$qtag" --json assets --jq '.assets[].name')
          printf '%s\n' "$published" | grep -Fxq SHA256SUMS
          for arch in aarch64_cortex-a53 aarch64_generic x86_64; do
            for line in 24.10 25.12; do
              expected="qmodem-3.3.0_p20261108-$arch-$line.tar.gz"
              printf '%s\n' "$published" | grep -Fxq "$expected" || { echo "Missing permanent QModem asset: $expected" >&2; exit 1; }
            done
          done
          tag='v0.16.0-alpha1-r4'
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing release $tag" >&2
            exit 1
          fi
          gh release create "$tag" release-assets/* \
            --target "$GITHUB_SHA" --prerelease \
            --title 'MedveModem 0.16.0 Alpha 1 r4' \
            --notes 'MedveModem engine, LuCI, Telegram bot and bot LuCI, optional lpac, six SDK targets (OpenWrt 24.10.8 IPK / 25.12.6 APK), SHA256SUMS. QModem core installs separately from pinned permanent release qmodem-3.3.0_p20261108-r1. Alpha software: use backup router access and validate on hardware.'
