# One-shot r7 release from an already successful, fully gated main build.
# GitHub Actions events created with GITHUB_TOKEN do not trigger tag workflows,
# so this publisher must create the GitHub Release and upload assets itself.
name: publish-alpha1-r7-after-build

on:
  workflow_run:
    workflows: [build]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-alpha1-r7
  cancel-in-progress: false

jobs:
  publish:
    name: Verify main build artifacts and publish r7
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Check exactly the r7 source and prevent duplicate releases
        id: eligibility
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "${{ github.event.workflow_run.head_sha }}" ]
          if ! grep -Fxq 'PKG_VERSION:=0.16.0_alpha1' Makefile ||
             ! grep -Fxq 'PKG_RELEASE:=7' Makefile; then
            echo 'This successful main build is not r7; skipping one-shot publisher.'
            echo 'eligible=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh release view v0.16.0-alpha1-r7 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'r7 GitHub Release already exists. Refusing to overwrite it.'
            echo 'eligible=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'eligible=true' >> "$GITHUB_OUTPUT"
      - name: Download all six packages from successful main build
        if: steps.eligibility.outputs.eligible == 'true'
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          pattern: medvemodem-*
          path: package-artifacts
      - name: Validate package matrix, create archives and SHA256 manifest
        if: steps.eligibility.outputs.eligible == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sh tools/check-web-version.sh
          python3 tests/test-luci-frontend.py
          sh tests/test-installer-release-selection.sh
          sh tests/test-installer-locks.sh
          mkdir -p release-assets
          count=0
          for arch in aarch64_cortex-a53 aarch64_generic x86_64; do
            for release in 24.10.8 25.12.6; do
              target="$arch-$release"
              dir="package-artifacts/medvemodem-$target"
              [ -d "$dir" ] || { echo "Missing successful build: $target" >&2; exit 1; }
              if [[ "$release" == 25.* ]]; then ext=apk; else ext=ipk; fi
              for package in medvemodem luci-app-medvemodem medvemodem-bot luci-app-medvemodem-bot; do
                if ! find "$dir" -maxdepth 1 -type f -name "$package*.$ext" |
                     grep -Eq "/$package([-_]0\\.16\\.0|_0\\.16\\.0)"; then
                  echo "Missing required $package ($target)" >&2
                  exit 1
                fi
              done
              name="medvemodem-0.16.0-alpha1-r7-$target.tar.gz"
              tar -C "$dir" -czf "release-assets/$name" .
              tar -tzf "release-assets/$name" >/dev/null
              count=$((count + 1))
            done
          done
          [ "$count" -eq 6 ]
          [ "$(find release-assets -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 6 ]
          (cd release-assets && sha256sum *.tar.gz > SHA256SUMS && sha256sum -c SHA256SUMS)
          test -s docs/RELEASE-HIGHLIGHTS-ALPHA1-R7.md
          cp docs/RELEASE-HIGHLIGHTS-ALPHA1-R7.md release-assets/HIGHLIGHTS.txt
          test -s release-assets/HIGHLIGHTS.txt
      - name: Create draft r7 with checksummed assets
        if: steps.eligibility.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create v0.16.0-alpha1-r7 release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ github.event.workflow_run.head_sha }}" \
            --draft --prerelease \
            --title 'MedveModem 0.16.0 Alpha 1 r7' \
            --notes-file docs/RELEASE-HIGHLIGHTS-ALPHA1-R7.md
      - name: Verify uploaded archives before making release public
        if: steps.eligibility.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloaded
          gh release download v0.16.0-alpha1-r7 \
            --repo "$GITHUB_REPOSITORY" --dir downloaded \
            --pattern '*.tar.gz' --pattern 'SHA256SUMS' --pattern 'HIGHLIGHTS.txt'
          test -s downloaded/HIGHLIGHTS.txt
          [ "$(find downloaded -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 6 ]
          (cd downloaded && sha256sum -c SHA256SUMS)
          gh release edit v0.16.0-alpha1-r7 \
            --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=true
          echo 'Published and verified v0.16.0-alpha1-r7'
