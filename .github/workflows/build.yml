# Public OpenWrt package builds.
# Run only by explicit workflow_dispatch. No push, PR or tag-triggered SDK builds.
# Manual publish_release=true plus release_tag creates a verified prerelease from main.
name: build

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish a version-tagged release after the build (normally off)'
        type: boolean
        required: true
        default: false
      release_tag:
        description: 'Version to publish from main after all six builds (for example v0.16.0-alpha1-r11)'
        type: string
        required: false
        default: ''

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  luci-contracts:
    name: LuCI frontend compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Verify frontend API, version, installer contracts and release metadata
        run: |
          python3 tests/test-luci-frontend.py
          python3 tests/test-ep06-temperature.py
          python3 tests/test-ep06-cell-lock.py
          python3 tests/test-qmodem-handover.py
          sh tools/check-web-version.sh
          sh tests/test-installer-release-selection.sh
          sh tests/test-installer-locks.sh

  luci-browser:
    name: LuCI Chromium smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Playwright client
        run: npm install --no-save --no-package-lock playwright@1.58.2
      - name: Exercise LuCI modem view in Chromium
        run: node tests/test-luci-browser.cjs

  packages:
    needs: [luci-contracts, luci-browser]
    name: ${{ matrix.arch }} / OpenWrt ${{ matrix.release }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64_cortex-a53, aarch64_generic, x86_64]
        release: ['25.12.6', '24.10.8']
    steps:
      - uses: actions/checkout@v5
      - name: Build in OpenWrt SDK
        run: tools/build.sh "${{ matrix.arch }}" "${{ matrix.release }}"
      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: medvemodem-${{ matrix.arch }}-${{ matrix.release }}
          path: dist/${{ matrix.arch }}-${{ matrix.release }}/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish tagged release
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true && (startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.release_tag, 'v'))
    needs: packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: medvemodem-*
          path: package-artifacts
          merge-multiple: false
      - name: Pack all six targets and checksums
        shell: bash
        env:
          SELECTED_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          tag="$SELECTED_TAG"
          [ -n "$tag" ] || tag="$GITHUB_REF_NAME"
          expected="v$(sed -n 's/^PKG_VERSION:=//p' Makefile | tr '_' '-')-r$(sed -n 's/^PKG_RELEASE:=//p' Makefile)"
          [ "$tag" = "$expected" ] || { echo "Release tag $tag does not match package version $expected" >&2; exit 1; }
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          mkdir -p release-assets
          archive_version="${tag#v}"
          for dir in package-artifacts/medvemodem-*; do
            [ -d "$dir" ] || { echo "missing artifact directory" >&2; exit 1; }
            [ "$(find "$dir" -maxdepth 1 -type f \( -name '*.apk' -o -name '*.ipk' \) | wc -l)" -gt 0 ] || { echo "No packages in $dir" >&2; exit 1; }
            target="${dir##*/medvemodem-}"
            tar -C "$dir" -czf "release-assets/medvemodem-${archive_version}-${target}.tar.gz" .
          done
          [ "$(find release-assets -name '*.tar.gz' | wc -l)" -eq 6 ] || { echo "Expected six build targets" >&2; exit 1; }
          (cd release-assets && sha256sum *.tar.gz > SHA256SUMS)
          revision="${tag##*-}"
          notes="docs/RELEASE-HIGHLIGHTS-ALPHA1-${revision^^}.md"
          [ -s "$notes" ] || { echo "Release highlights missing: $notes" >&2; exit 1; }
          cp "$notes" release-assets/HIGHLIGHTS.txt
      - name: Publish draft and verify GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          revision="${tag##*-}"
          notes="docs/RELEASE-HIGHLIGHTS-ALPHA1-${revision^^}.md"
          [ -s "$notes" ] || { echo "Release notes missing: $notes" >&2; exit 1; }
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing release $tag" >&2
            exit 1
          fi
          (cd release-assets && sha256sum -c SHA256SUMS)
          gh release create "$tag" release-assets/* \
            --target "$GITHUB_SHA" --draft --prerelease \
            --title "MedveModem ${tag#v}" \
            --notes-file "$notes"
          mkdir -p downloaded
          gh release download "$tag" --dir downloaded --pattern '*.tar.gz' --pattern SHA256SUMS --pattern HIGHLIGHTS.txt
          [ -s downloaded/HIGHLIGHTS.txt ] || { echo "Missing uploaded release highlights" >&2; exit 1; }
          [ "$(find downloaded -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 6 ] ||
            { echo "Expected exactly six uploaded archives" >&2; exit 1; }
          (cd downloaded && sha256sum -c SHA256SUMS)
          gh release edit "$tag" --draft=false --prerelease=true
