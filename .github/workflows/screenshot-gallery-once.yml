name: Publish MedveModem screenshots (one-shot)
on:
  push:
    paths:
      - .github/workflows/screenshot-gallery-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack-screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract screenshot gallery and update main README
        shell: bash
        run: |
          set -euo pipefail
          test -f screenshots/medvemodem-screenshots-ready.zip
          mkdir -p /tmp/medvemodem-gallery
          unzip -q screenshots/medvemodem-screenshots-ready.zip -d /tmp/medvemodem-gallery
          test -f /tmp/medvemodem-gallery/screenshots/README.md
          test -f /tmp/medvemodem-gallery/screenshots/01-modems-cards.png
          test -f /tmp/medvemodem-gallery/screenshots/12-site-access-speed-check.png
          test "$(find /tmp/medvemodem-gallery/screenshots -maxdepth 1 -name '*-thumb.png' | wc -l)" -eq 12
          test "$(find /tmp/medvemodem-gallery/screenshots -maxdepth 1 -name '*.png' | wc -l)" -eq 24
          cp -a /tmp/medvemodem-gallery/screenshots/. screenshots/
          python3 - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text(encoding='utf-8')
          gallery = (
              '\n**[Screenshots / Скриншоты интерфейса — 12 изображений](screenshots/README.md)**\n\n'
              '[![MedveModem LuCI: главные карточки модемов, резервные каналы и состояние связи]'
              '(screenshots/01-modems-cards.png)](screenshots/README.md)\n'
          )
          marker = '\n</div>\n'
          assert s.count(marker) == 1, 'main README layout changed'
          if 'screenshots/01-modems-cards.png' not in s:
              s = s.replace(marker, gallery + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY
          rm -f screenshots/medvemodem-screenshots-ready.zip screenshots/test
          rm -f .github/workflows/screenshot-gallery-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md screenshots .github/workflows/screenshot-gallery-once.yml
          git diff --cached --check
          git commit -m "docs(screenshots): publish 12-image clickable gallery and README preview"
          git push origin HEAD:main
