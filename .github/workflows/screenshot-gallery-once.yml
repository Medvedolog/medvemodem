name: Publish MedveModem screenshots (one-shot)
on:
  push:
    paths:
      - .github/workflows/screenshot-gallery-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack-screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract screenshot gallery and update main README
        shell: bash
        run: |
          set -euo pipefail
          test -f screenshots/medvemodem-screenshots-ready.zip
          mkdir -p /tmp/medvemodem-gallery
          unzip -t screenshots/medvemodem-screenshots-ready.zip | tail -3
          unzip -Z1 screenshots/medvemodem-screenshots-ready.zip
          unzip -q screenshots/medvemodem-screenshots-ready.zip -d /tmp/medvemodem-gallery
          find /tmp/medvemodem-gallery -type f | sort
          test -f /tmp/medvemodem-gallery/screenshots/README.md
          test -f /tmp/medvemodem-gallery/screenshots/01-modems-cards.png
          # The uploaded archive keeps screenshot 12 as services_check.png.
          # Normalize its name; GitHub scales the full PNG as its thumbnail.
          test -f /tmp/medvemodem-gallery/screenshots/services_check.png
          mv /tmp/medvemodem-gallery/screenshots/services_check.png /tmp/medvemodem-gallery/screenshots/12-site-access-speed-check.png
          cp /tmp/medvemodem-gallery/screenshots/12-site-access-speed-check.png /tmp/medvemodem-gallery/screenshots/12-site-access-speed-check-thumb.png
          test "$(find /tmp/medvemodem-gallery/screenshots -maxdepth 1 -name '*-thumb.png' | wc -l)" -eq 12
          test "$(find /tmp/medvemodem-gallery/screenshots -maxdepth 1 -name '*.png' | wc -l)" -eq 24
          cp -a /tmp/medvemodem-gallery/screenshots/. screenshots/
          python3 - <<'PY'
          from pathlib import Path
          p = Path('screenshots/README.md')
          s = p.read_text(encoding='utf-8')
          if '12-site-access-speed-check.png' not in s:
              cell = ('    <td align="center" width="33%"><a href="12-site-access-speed-check.png">'
                      '<img src="12-site-access-speed-check-thumb.png" alt="Site access and speed checks" width="260">'
                      '</a><br><strong>Проверка доступности сервисов и скорости</strong>'
                      '<br><sub>Site access checks and speed test</sub></td>\n')
              head, sep, tail = s.partition('</table>')
              assert sep and '</tr>' in head, 'gallery table not found'
              before, end, after = head.rpartition('</tr>')
              s = before + cell + end + after + sep + tail
              s += '\n12. [Проверка сервисов и скорости / Site access and speed test](12-site-access-speed-check.png)\n'
          p.write_text(s, encoding='utf-8')
          PY
          python3 - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text(encoding='utf-8')
          gallery = (
              '\n**[Screenshots / Скриншоты интерфейса — 12 изображений](screenshots/README.md)**\n\n'
              '[![MedveModem LuCI: главные карточки модемов, резервные каналы и состояние связи]'
              '(screenshots/01-modems-cards.png)](screenshots/README.md)\n'
          )
          marker = '\n</div>\n'
          assert s.count(marker) == 1, 'main README layout changed'
          if 'screenshots/01-modems-cards.png' not in s:
              s = s.replace(marker, gallery + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY
          rm -f screenshots/medvemodem-screenshots-ready.zip screenshots/test
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md screenshots
          git diff --cached --check
          git commit -m "docs(screenshots): publish 12-image clickable gallery and README preview"
          git push origin HEAD:main
