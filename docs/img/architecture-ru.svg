<text x="936" y="457" font-size="11" font-weight="normal" fill="#52606d" text-anchor="start">бот</text>
<rect x="928" y="470" width="164" height="38" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
<text x="936" y="486" font-size="12" font-weight="bold" fill="#1f2933" text-anchor="start">ntfy, вебхук, SMS</text>
