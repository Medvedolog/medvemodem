<rect x="468.66666666666663" y="72" width="202.66666666666666" height="52" rx="8" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="570.0" y="94" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">medvemodem</text>
<text x="570.0" y="112" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">консоль: CLI и экран top</text>
<rect x="687.3333333333333" y="72" width="202.66666666666666" height="52" rx="8" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="788.6666666666666" y="94" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Telegram-бот</text>
<text x="788.6666666666666" y="112" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">ucode, по желанию</text>
<line x1="570.0" y1="128" x2="570.0" y2="160" stroke="#9aa5b1" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
<text x="580.0" y="149" font-size="12" font-weight="normal" fill="#52606d" text-anchor="start">ubus: объект «medvemodem» — одно API для всех</text>
<rect x="250" y="164" width="640" height="300" rx="10" fill="#f0fff4" stroke="#2f855a" stroke-width="1.5"/>
<text x="264" y="188" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="start">medvemodemd — движок на C, один процесс (uloop)</text>
<rect x="262" y="202" width="205" height="250" rx="8" fill="#ffffff" stroke="#2f855a" stroke-width="1.5"/>
<text x="272" y="222" font-size="13" font-weight="bold" fill="#2f855a" text-anchor="start">Ядро</text>
<text x="272" y="248" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="start">• USB-устройства и профили</text>
<text x="272" y="278" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="start">• кто владеет модемом</text>
<text x="272" y="308" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="start">• подключение, интерфейс</text>
<text x="272" y="338" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="start">• проверка связи</text>
<text x="272" y="368" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="start">• переключение каналов, DNS</text>
<text x="272" y="398" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="start">• восстановление по шагам</text>
<rect x="477" y="202" width="205" height="250" rx="8" fill="#ffffff" stroke="#2f855a" stroke-width="1.5"/>
<text x="487" y="222" font-size="13" font-weight="bold" fill="#2f855a" text-anchor="start">Модули mgr_*</text>
<text x="487" y="248" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="start">• SMS и пересылка</text>
<text x="487" y="278" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="start">• радио и история сигнала</text>
<text x="487" y="308" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="start">• веб модема (HiLink, ZTE)</text>
<text x="487" y="338" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="start">• трафик и лимиты SIM</text>
<text x="487" y="368" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="start">• SIM, eSIM, уведомления</text>
<text x="487" y="398" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="start">• режим белых списков</text>
<rect x="692" y="202" width="186" height="250" rx="8" fill="#fffaf0" stroke="#b7791f" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="702" y="222" font-size="13" font-weight="bold" fill="#b7791f" text-anchor="start">Помощники</text>
<text x="702" y="238" font-size="10" font-weight="normal" fill="#52606d" text-anchor="start">/usr/libexec/medvemodem</text>
<text x="702" y="262" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="start">• AT-задания</text>
<text x="702" y="290" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="start">• чтение веба модема</text>
<text x="702" y="318" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="start">• спидтест</text>
<text x="702" y="346" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="start">• режим белых списков</text>
<text x="702" y="374" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="start">• пересылка SMS</text>
<text x="702" y="402" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="start">• установка пакетов</text>
<line x1="570.0" y1="466" x2="570.0" y2="500" stroke="#9aa5b1" stroke-width="2" marker-end="url(#a)"/>
<text x="580.0" y="492" font-size="13" font-weight="bold" fill="#52606d" text-anchor="start">Исполнитель — у каждого модема ровно один</text>
